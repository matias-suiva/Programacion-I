<!DOCTYPE html>
<!-- Declaración de HTML5 -->

<html lang="es">

<head>

    <!-- Configuración de caracteres -->
    <meta charset="UTF-8">

    <!-- Adaptación a dispositivos móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título de la pestaña -->
    <title>Starbucks Argentina</title>

    <!-- Conexión con CSS -->
    <link rel="stylesheet" href="css/estilos.css">

</head>

<body>

    <!-- ENCABEZADO -->
    <header>

        <!--
            CONSIGNA:
            Deben insertar aquí la imagen logo.png proporcionada.
            La imagen representa el logo principal de Starbucks Argentina.
        -->
    
        <!-- Título principal -->
        <h1>Starbucks Argentina</h1>

        <!-- Eslogan -->
        <p>Disfrutá el mejor café del mundo</p>

    </header>

    <!-- MENÚ -->
    <nav>

        <a href="#inicio">Inicio</a>

        <a href="#productos">Productos</a>

        <a href="#contacto">Contacto</a>

    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main id="inicio">

        <!-- SECCIÓN PRODUCTOS -->
        <section id="productos">

            <h2>Nuestros Productos</h2>

            <!-- CONTENEDOR FLEXBOX -->
            <div class="contenedor-productos">

                <!-- PRODUCTO 1 -->
                <article>

                    <!--
                        CONSIGNA:
                        Deben insertar aquí la imagen producto1.png
                        correspondiente al producto Frappuccino.
                    -->
            
                    <h3>Frappuccino</h3>

                    <p>Bebida fría con crema.</p>

                </article>

                <!-- PRODUCTO 2 -->
                <article>

                    <!--
                        CONSIGNA:
                        Deben insertar aquí la imagen producto2.png
                        correspondiente al producto Latte.
                    -->

                    <h3>Latte</h3>

                    <p>Café espresso con leche.</p>

                </article>

                <!-- PRODUCTO 3 -->
                <article>

                    <!--
                        CONSIGNA:
                        Deben insertar aquí la imagen producto3.png
                        correspondiente al producto Mocha.
                    -->
                
                    <h3>Mocha</h3>

                    <p>Café con chocolate.</p>

                </article>

            </div>

        </section>

        <!-- CONTACTO -->
        <section id="contacto">

            <h2>Información</h2>

           <!--
                CONSIGNA:
                Deben crear un botón con el id "btnInfo" y el texto "Información Starbucks".
                Al hacer clic en el botón, se debe mostrar un mensaje de alerta con información
                relevante sobre Starbucks Argentina.
            -->

        </section>

    </main>

    <!-- PIE DE PÁGINA -->
    <footer>

        <p>
            © 2026 Starbucks Argentina
            Autor: [Tu Nombre]
        </p>

    </footer>

    <!-- Conexión JavaScript -->
    <script src="js/script.js"></script>

</body>

</html>
