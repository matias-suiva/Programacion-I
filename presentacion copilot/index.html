<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Presentación académica interactiva de Antropología Filosófica: Ciberseguridad, ciberfraude e inteligencia artificial. ICOP Nº 4021 - Alumno: Suiva Matias." />
  <meta name="theme-color" content="#08090B" />
  <title>Antropología Filosófica — Ciberseguridad, Ciberfraude e Inteligencia Artificial</title>
  
  <!-- Estilos del Sistema (Modular MVC) -->
  <link rel="stylesheet" href="css/main.css" />
  <link rel="icon" type="image/png" href="assets/images/mr-robot-title.png" />
</head>
<body>

  <div class="app-shell" id="app">
    <!-- Capas cinematográficas Mr. Robot (Scanlines y Viñeta) -->
    <div class="scanlines-overlay" aria-hidden="true"></div>
    <div class="vignette-overlay" aria-hidden="true"></div>

    <!-- Escenario 16:9 Adaptativo -->
    <main class="presentation-stage" id="presentation-stage">
      
      <!-- Barra superior estilo terminal de control -->
      <header class="terminal-header" role="banner">
        <div class="terminal-header-left">
          <span class="status-dot-pulse" title="Sistema en línea"></span>
          <span class="terminal-badge">SYS.ANTROPOLOGIA</span>
          <span class="terminal-path" id="terminal-path">fsociety://antropologia-filosofica/<span>slide-01_portada</span></span>
        </div>
        
        <div class="terminal-header-center">
          <span class="terminal-badge">ICOP Nº 4021 // CICLO 2026</span>
        </div>

        <div class="terminal-header-right">
          <span class="terminal-path">MODO: <span>COLOQUIO FINAL</span></span>
          <span class="terminal-badge" style="border-color: rgba(42, 157, 143, 0.4); color: #2A9D8F; background: rgba(42, 157, 143, 0.1);">ACTIVO</span>
        </div>
      </header>

      <!-- Contenedor dinámico de Diapositivas (Gestionado por PresentationView) -->
      <section class="slides-viewport" id="slides-viewport" aria-live="polite">
        <!-- Las diapositivas se renderizan aquí mediante JavaScript ES Modules -->
      </section>

      <!-- Barra de controles y progreso inferior -->
      <footer class="terminal-footer" role="contentinfo">
        <!-- Barra de progreso continua -->
        <div class="progress-bar-container" title="Progreso de la presentación">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>

        <!-- Indicador de diapositiva actual -->
        <div class="slide-counter" id="slide-counter">
          <span>SLIDE</span>
          <span class="current" id="slide-current">01</span>
          <span class="divider">/</span>
          <span class="total" id="slide-total">14</span>
        </div>

        <!-- Atajos de teclado en pantalla -->
        <div class="keyboard-hints">
          <span><span class="key-pill">←</span> <span class="key-pill">→</span> Navegar</span>
          <span><span class="key-pill">F</span> Pantalla completa</span>
          <span><span class="key-pill">O</span> Índice</span>
          <span><span class="key-pill">P</span> Imprimir / PDF</span>
        </div>

        <!-- Botonera de control interactiva -->
        <div class="nav-controls">
          <button type="button" class="btn-terminal" id="btn-prev" title="Diapositiva anterior (Flecha Izquierda)" aria-label="Anterior">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
            Anterior
          </button>
          
          <button type="button" class="btn-terminal btn-primary" id="btn-next" title="Diapositiva siguiente (Flecha Derecha o Espacio)" aria-label="Siguiente">
            Siguiente
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </button>

          <button type="button" class="btn-terminal" id="btn-overview" title="Abrir índice de diapositivas (Tecla O)" aria-label="Índice">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
            Índice
          </button>

          <button type="button" class="btn-terminal" id="btn-fullscreen" title="Modo pantalla completa (Tecla F)" aria-label="Pantalla completa">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            Pantalla completa
          </button>

          <button type="button" class="btn-terminal" id="btn-print" title="Exportar o imprimir a PDF (Ctrl+P)" aria-label="Imprimir">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect width="12" height="8" x="6" y="14"/></svg>
            PDF
          </button>
        </div>
      </footer>
    </main>

    <!-- Modal de Vista General / Selector de Diapositiva -->
    <div class="overview-modal" id="overview-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Índice de Diapositivas">
      <div class="overview-header">
        <div class="terminal-badge" style="font-size: 0.85rem;">[FSOCIETY // ÍNDICE GENERAL DE LA EXPOSICIÓN]</div>
        <button type="button" class="btn-terminal" id="btn-overview-close">
          Cerrar [ESC] ✕
        </button>
      </div>
      <div class="overview-grid" id="overview-grid">
        <!-- Renderizado dinámicamente por ControlsView -->
      </div>
    </div>
  </div>

  <!-- Inicialización Inteligente Universal:
       Si se ejecuta desde el sistema de archivos local (file://), carga el bundle local sin restricciones CORS.
       Si se sirve mediante un servidor HTTP/HTTPS (Live Server), carga los ES Modules nativos. -->
  <script>
    (function() {
      const script = document.createElement('script');
      if (window.location.protocol === 'file:') {
        script.src = 'js/app.local.js';
      } else {
        script.type = 'module';
        script.src = 'js/app.js';
      }
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
